<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>One Question</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(120deg, #ffd6e0, #ffeef3);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 40px;
      border-radius: 18px;
      text-align: center;
      width: 340px;
      box-shadow: 0 0 30px rgba(255,77,109,0.4);
      animation: pulse 2.8s infinite;
      z-index: 2;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.04); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    p {
      font-size: 18px;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
    }

    button {
      padding: 12px 22px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
      animation: bounce 1.8s infinite;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    #noBtn {
      background: #ddd;
    }

    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    .love-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      font-size: 42px;
      color: white;
      text-align: center;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
      opacity: 0;
      animation: fadeScale 2s forwards;
      z-index: 3;
    }

    @keyframes fadeScale {
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .heart {
      position: fixed;
      bottom: -30px;
      font-size: 28px;
      animation: floatUp 6s linear forwards;
      z-index: 4;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-130vh); opacity: 0; }
    }
  </style>
</head>

<body>

  <div class="card" id="card">
    <h1>Hey Musa</h1>
    <p>Will you please be my girlfriend?</p>

    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn")
    const noBtn = document.getElementById("noBtn")
    const card = document.getElementById("card")

    yesBtn.addEventListener("click", () => {
      card.remove()
      playVideo()
      startHearts()
    })

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 100)
      const y = Math.random() * (window.innerHeight - 100)
      noBtn.style.position = "fixed"
      noBtn.style.left = x + "px"
      noBtn.style.top = y + "px"
    })

    function playVideo() {
      const video = document.createElement("video")
      video.src = "video.mp4"
      video.autoplay = true
      video.playsInline = true
      video.controls = false

      video.addEventListener("ended", () => {
        showLoveText()
        startHearts()
      })

      document.body.appendChild(video)
    }

    function showLoveText() {
      const text = document.createElement("div")
      text.className = "love-text"
      text.innerText = "I LOVE YOU Uzwothe"
      document.body.appendChild(text)
    }

    function startHearts() {
      setInterval(() => {
        const heart = document.createElement("div")
        heart.className = "heart"
        heart.innerText = "❤️"
        heart.style.left = Math.random() * 100 + "vw"
        document.body.appendChild(heart)
        setTimeout(() => heart.remove(), 6000)
      }, 220)
    }
  </script>

</body>
</html>
