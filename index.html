<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Musa ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Georgia', serif;
  background: #f9f3f5;
  overflow: hidden;
}

.background-hearts {
  position: fixed;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.soft-heart {
  position: absolute;
  font-size: 18px;
  opacity: 0.15;
  animation: drift 15s linear infinite;
}

@keyframes drift {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

.card {
  background: white;
  padding: 60px;
  border-radius: 16px;
  width: 420px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.08);
  z-index: 2;
}

.name {
  font-size: 20px;
  color: #b76e79;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

h1 {
  font-weight: normal;
  margin-bottom: 20px;
}

p {
  color: #555;
  line-height: 1.6;
}

.buttons {
  margin-top: 40px;
  display: flex;
  justify-content: center;
  gap: 30px;
}

button {
  padding: 12px 28px;
  font-size: 16px;
  border-radius: 30px;
  border: 1px solid #b76e79;
  background: white;
  cursor: pointer;
  transition: all 0.3s ease;
}

#yesBtn {
  background: #b76e79;
  color: white;
}

button:hover {
  transform: scale(1.05);
}

.love-screen {
  position: fixed;
  inset: 0;
  background: #f9f3f5;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  animation: fadeIn 2s ease forwards;
  z-index: 5;
}

.love-screen h1 {
  font-size: 42px;
  color: #b76e79;
  font-weight: normal;
  margin-bottom: 20px;
}

.love-screen p {
  font-size: 20px;
  color: #555;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="background-hearts" id="bgHearts"></div>

<div class="card" id="card">
  <div class="name">Musa</div>
  <h1>Will you be my Valentine?</h1>
  <p>
    I would love to spend this Valentine’s Day with you.  
    Not because it is a date on a calendar,  
    but because you mean something to me.
  </p>

  <div class="buttons">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>
</div>

<script>
const yesBtn = document.getElementById("yesBtn")
const noBtn = document.getElementById("noBtn")
const card = document.getElementById("card")
const bgHearts = document.getElementById("bgHearts")

yesBtn.addEventListener("click", () => {
  card.remove()
  showLoveScreen()
})

noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * (window.innerWidth - 100)
  const y = Math.random() * (window.innerHeight - 100)
  noBtn.style.position = "fixed"
  noBtn.style.left = x + "px"
  noBtn.style.top = y + "px"
})

function showLoveScreen() {
  const screen = document.createElement("div")
  screen.className = "love-screen"
  screen.innerHTML = `
    <h1>Musa ❤️</h1>
    <p>I would love to call you my Valentine.</p>
  `
  document.body.appendChild(screen)
}

function createSoftHearts() {
  setInterval(() => {
    const heart = document.createElement("div")
    heart.className = "soft-heart"
    heart.innerText = "❤️"
    heart.style.left = Math.random() * 100 + "vw"
    heart.style.animationDuration = 10 + Math.random() * 10 + "s"
    bgHearts.appendChild(heart)
    setTimeout(() => heart.remove(), 20000)
  }, 800)
}

createSoftHearts()
</script>

</body>
</html>
